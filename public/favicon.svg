<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Wheel Border -->
    <circle cx="50" cy="50" r="48" fill="#1A1A24" />
    <circle cx="50" cy="50" r="44" fill="#0A0A0F" />
    
    <!-- Slice 1: Purple -->
    <path d="M50 50 L50 6 A44 44 0 0 1 88.1 25 Z" fill="#8B5CF6"/>
    <!-- Slice 2: Pink -->
    <path d="M50 50 L88.1 25 A44 44 0 0 1 88.1 75 Z" fill="#EC4899"/>
    <!-- Slice 3: Amber -->
    <path d="M50 50 L88.1 75 A44 44 0 0 1 50 94 Z" fill="#F59E0B"/>
    <!-- Slice 4: Rust/Orange -->
    <path d="M50 50 L50 94 A44 44 0 0 1 11.9 75 Z" fill="#EA580C"/>
    <!-- Slice 5: Red -->
    <path d="M50 50 L11.9 75 A44 44 0 0 1 11.9 25 Z" fill="#EF4444"/>
    <!-- Slice 6: Teal -->
    <path d="M50 50 L11.9 25 A44 44 0 0 1 50 6 Z" fill="#14B8A6"/>
    
    <!-- Center circle -->
    <circle cx="50" cy="50" r="12" fill="#1A1A24"/>
    <circle cx="50" cy="50" r="8" fill="#FFFFFF"/>
    
    <!-- Pointer -->
    <polygon points="50,4 58,16 42,16" fill="#FFFFFF" />
  </g>
</svg>